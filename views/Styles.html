<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens (tone warna) ---------- */
:root{
  --bg:#eef2fb; --bg-soft:#f5f7fd; --surface:#ffffff; --surface-2:#f8faff;
  --ink:#0f1a3a; --ink-2:#3b4565; --muted:#6b7590; --line:#e1e7f3;
  --primary:#1d4ed8; --primary-h:#1e40af; --primary-soft:#e3eaff; --on-primary:#ffffff;
  --btn-dark:#0f1a3a; --on-btn-dark:#ffffff;
  --band:#272c78; --star:#f8c51c;
  --red:#e0322b; --yellow:#ffc107; --teal:#1fa3a8; --green:#22a64a;
  --g1:#4338ca; --g2:#7c3aed; --g3:#b5576b;
  --ok:#15803d; --ok-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7; --err:#b91c1c; --err-soft:#fee2e2;
  --glow:rgba(79,99,255,.22);
  --shadow:0 10px 30px -14px rgba(15,26,58,.22);
  --shadow-lg:0 30px 60px -24px rgba(30,50,120,.32);
  --radius:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0f1f; --bg-soft:#0d1427; --surface:#121a33; --surface-2:#172042;
    --ink:#eef1fb; --ink-2:#c3cae0; --muted:#8e98b6; --line:#243055;
    --primary:#3b6cf6; --primary-h:#5b84ff; --primary-soft:#1a2550;
    --btn-dark:#eef1fb; --on-btn-dark:#0f1a3a;
    --band:#1d2266;
    --g1:#818cf8; --g2:#a78bfa; --g3:#f08aa0;
    --ok:#4ade80; --ok-soft:#0f2e1c; --warn:#fbbf24; --warn-soft:#33260a; --err:#f87171; --err-soft:#3a1214;
    --glow:rgba(91,132,255,.20);
    --shadow:0 10px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 30px 60px -24px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0f1f; --bg-soft:#0d1427; --surface:#121a33; --surface-2:#172042;
  --ink:#eef1fb; --ink-2:#c3cae0; --muted:#8e98b6; --line:#243055;
  --primary:#3b6cf6; --primary-h:#5b84ff; --primary-soft:#1a2550;
  --btn-dark:#eef1fb; --on-btn-dark:#0f1a3a;
  --band:#1d2266;
  --g1:#818cf8; --g2:#a78bfa; --g3:#f08aa0;
  --ok:#4ade80; --ok-soft:#0f2e1c; --warn:#fbbf24; --warn-soft:#33260a; --err:#f87171; --err-soft:#3a1214;
  --glow:rgba(91,132,255,.20);
  --shadow:0 10px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 30px 60px -24px rgba(0,0,0,.7);
  color-scheme:dark;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.15;letter-spacing:-.02em}
p{margin:0}
.container{width:100%;max-width:1180px;margin:0 auto;padding:0 16px}
@media (min-width:720px){.container{padding:0 28px}}
.grad-text{background:linear-gradient(90deg,var(--g1),var(--g2) 50%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:0 10px 24px -10px var(--primary)}
.btn-primary:hover:not(:disabled){background:var(--primary-h)}
.btn-dark{background:var(--btn-dark);color:var(--on-btn-dark)}
.btn-dark:hover:not(:disabled){opacity:.9}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover:not(:disabled){border-color:var(--primary)}
.btn-danger{background:var(--err-soft);color:var(--err)}
.btn-sm{height:34px;padding:0 14px;font-size:13px}
.btn-icon{width:40px;height:40px;padding:0;border-radius:12px;background:transparent;border:1px solid transparent;color:var(--ink-2)}
.btn-icon:hover{background:var(--primary-soft);color:var(--primary)}
.btn .spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Cards & forms ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.input,.select,.textarea{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);outline:none;transition:border .15s,box-shadow .15s}
.textarea{height:auto;min-height:96px;padding:12px 14px;resize:vertical}
@media (pointer:coarse){.input,.select,.textarea{font-size:16px}}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.grid-2{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:640px){.grid-2{grid-template-columns:1fr 1fr}}

/* toggle switch */
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track{width:46px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked + .track{background:var(--primary)}
.switch input:checked + .track::after{transform:translateX(20px)}
.switch input:focus-visible + .track{box-shadow:0 0 0 4px var(--primary-soft)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.err{background:var(--err-soft);color:var(--err)}
.badge.mute{background:var(--bg-soft);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(10,15,31,.55);backdrop-filter:blur(6px)}
.modal.show{display:flex;animation:fade .2s}
.modal-box{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);animation:pop .25s}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px 0}
.modal-body{padding:18px 22px 22px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:0 22px 22px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}

/* ---------- Toast ---------- */
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:420px}
.toast{padding:12px 16px;border-radius:14px;background:var(--btn-dark);color:var(--on-btn-dark);font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);animation:pop .25s}
.toast.err{background:var(--err);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
:root[data-theme="dark"] .toast.ok{color:#0a0f1f}

/* ---------- Brand emblem ---------- */
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:38px;height:38px;flex:none;border-radius:10px;overflow:hidden;display:grid;place-items:center}
.brand-logo img{width:100%;height:100%;object-fit:contain}
.brand-text{min-width:0;line-height:1.15}
.brand-name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name b{color:var(--yellow)}
.brand-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
